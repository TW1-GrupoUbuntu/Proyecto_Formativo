# Dovecot de la Proyecto Formativo: IMAP solo sobre TLS (993), entrega LMTP, autenticacion SASL para Postfix y Sieve
protocols = imap lmtp
mail_location = maildir:~/Maildir
first_valid_uid = 1000
disable_plaintext_auth = yes
auth_mechanisms = plain login
# el usuario del sistema es solo la parte local (luis), aunque el cliente o LMTP entreguen luis@dominio
auth_username_format = %Ln
postmaster_address = postmaster@__DOM__

ssl = required
ssl_cert = </etc/ssl/correo/cert.pem
ssl_key = </etc/ssl/correo/key.pem
ssl_min_protocol = TLSv1.2

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
plugin {
  sieve_before = /etc/dovecot/sieve/antispam.sieve
}
namespace inbox {
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}
