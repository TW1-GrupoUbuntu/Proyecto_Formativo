# Sitio de la Cooperativa Jesus Nazareno: HTTP solo redirige; HTTPS con la CA interna y cabeceras de seguridad.
server {
    listen 80 default_server;
    server_name www.nazareno.internal portal.nazareno.internal www.nazareno.example nazareno.example;
    access_log /var/log/nginx/nazareno.access.log nazareno;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2 default_server;
    server_name www.nazareno.internal portal.nazareno.internal www.nazareno.example nazareno.example;
    access_log /var/log/nginx/nazareno.access.log nazareno;
    ssl_certificate     /etc/ssl/nazareno/cert.pem;
    ssl_certificate_key /etc/ssl/nazareno/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    root /srv/nazareno/www;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    # Reportes de GoAccess: solo con usuario y clave; el informe usa JavaScript propio, por eso su CSP es mas amplia
    location /reportes/ {
        alias /srv/nazareno/reportes/;
        auth_basic "Reportes";
        auth_basic_user_file /etc/nginx/reportes.htpasswd;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:" always;
    }
}
