# /etc/unbound/unbound.conf.d/nazareno-resolutor.conf — Resolutor de la cooperativa (10.20.0.4)
# Rol: resolver TODO para la red de la cooperativa, con caché, validación DNSSEC, salida cifrada (DoT) y filtrado (RPZ).
server:
    interface: 10.20.0.4
    interface: 127.0.0.1                # no 0.0.0.0: el DNS embebido de Docker ya ocupa 127.0.0.11:53
    port: 53
    do-ip6: no

    # Solo la red de la cooperativa puede usarlo (un resolutor abierto es un arma de amplificación)
    access-control: 0.0.0.0/0 refuse     # por defecto se rechaza a todo el mundo
    access-control: 127.0.0.0/8 allow
    access-control: 10.20.0.0/24 allow  # solo la red de la cooperativa

    # Privacidad y robustez
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes          # a cada servidor solo se le pregunta lo mínimo necesario
    prefetch: yes                    # renueva en caché lo popular antes de que venza
    serve-expired: yes               # si internet se cae, responde lo último conocido (máx. 1 día)
    serve-expired-ttl: 86400
    cache-min-ttl: 60
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # DNSSEC: validar todo lo firmado. El ancla de confianza de la raíz ya la declara Ubuntu en
    # root-auto-trust-anchor-file.conf (/var/lib/unbound/root.key, creada con unbound-anchor).
    # respip = módulo que aplica la RPZ; validator = DNSSEC; iterator = resolución
    module-config: "respip validator iterator"
    # .internal NO existe en la raíz: sin esto, la validación diría que nuestras respuestas son falsas (bogus)
    domain-insecure: "nazareno.internal"
    domain-insecure: "nazareno.example"
    domain-insecure: "aliada.internal"
    domain-insecure: "0.20.10.in-addr.arpa"
    # Permitir respuestas con IPs privadas solo para nuestros dominios (protección contra DNS rebinding)
    private-address: 10.0.0.0/8
    private-domain: "nazareno.internal"
    private-domain: "nazareno.example"
    private-domain: "aliada.internal"
    # Unbound bloquea por defecto las inversas de redes privadas (10.in-addr.arpa → "static", sin respuesta).
    # nodefault quita ese bloqueo para que nuestra stub-zone 0.20.10.in-addr.arpa funcione.
    local-zone: "10.in-addr.arpa." nodefault

    # Certificados de las CA públicas para verificar el DoT
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    log-queries: no
    verbosity: 1

# Nuestras zonas: preguntar directamente a ns1 y ns2 (autoritativos de la cooperativa)
stub-zone:
    name: "nazareno.internal"
    stub-addr: 10.20.0.2
    stub-addr: 10.20.0.3

stub-zone:
    name: "nazareno.example"
    stub-addr: 10.20.0.2
    stub-addr: 10.20.0.3

stub-zone:
    name: "aliada.internal"
    stub-addr: 10.20.0.2

stub-zone:
    name: "0.20.10.in-addr.arpa"
    stub-addr: 10.20.0.2
    stub-addr: 10.20.0.3

# Todo lo demás: reenviar CIFRADO (DNS sobre TLS, puerto 853) a resolutores públicos
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net

# Filtrado con RPZ (Response Policy Zone): la lista negra de la cooperativa en formato estándar
rpz:
    name: "rpz.nazareno.internal"
    zonefile: "/etc/unbound/rpz.nazareno.internal"
    rpz-log: yes
    rpz-log-name: "filtro-cooperativa"

# (remote-control ya está habilitado por Ubuntu en remote-control.conf: unbound-control funciona sin más)
